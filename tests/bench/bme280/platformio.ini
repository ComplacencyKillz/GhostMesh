; GhostMesh bench test — BME280 (Phase 7) on Heltec WiFi LoRa 32 V3.
; Throwaway diagnostic firmware. Flash to a spare Heltec, or reflash Meshtastic
; onto the deploy node when you're done.
;
; If the board isn't recognized, run `pio pkg update` to refresh the espressif32
; platform. Generic fallback board: esp32-s3-devkitc-1

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

; Heltec V3 routes its USB-C console through the CP2102 bridge (UART0), not the
; ESP32-S3 native USB-CDC. Force CDC-on-boot off so Serial maps to that bridge.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
