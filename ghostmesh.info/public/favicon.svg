<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Mesh node: three nodes connected -->
  <circle cx="16" cy="8"  r="3" fill="#00d4ff" opacity="0.9"/>
  <circle cx="7"  cy="24" r="3" fill="#00d4ff" opacity="0.9"/>
  <circle cx="25" cy="24" r="3" fill="#00d4ff" opacity="0.9"/>
  <!-- Signal packet traveling: small green dot -->
  <circle cx="16" cy="16" r="2" fill="#00ff41" opacity="0.85"/>
  <!-- Connections -->
  <line x1="16" y1="8"  x2="7"  y2="24" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
  <line x1="16" y1="8"  x2="25" y2="24" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
  <line x1="7"  y1="24" x2="25" y2="24" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
</svg>
