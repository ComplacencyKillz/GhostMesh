# GhostMesh custom profiles
# Upload this file to: SD:/apps_data/ghostmesh/profiles.yaml
#
# FORMAT RULES:
#   name: <Profile Name>   starts a new profile (required before messages)
#   - <message>            adds a message to the current profile
#   # <anything>           comment, ignored
#   Blank lines            ignored
#   Unknown keys           silently ignored
#
# LIMITS:
#   Max 5 profiles from this file (plus 3 built-ins = 8 total)
#   Max 12 messages per profile
#   Max 22 characters per message
#   Max 19 characters for profile name
#   Messages are truncated to 22 chars if longer
#   Only printable ASCII (0x20-0x7E) — accented chars and emoji are stripped
#
# Profiles with no messages are silently discarded.
# Quotes around names and messages are optional but supported.

